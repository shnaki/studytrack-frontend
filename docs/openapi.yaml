components:
  schemas:
    CreateStudyLogRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateStudyLogRequest.json
          format: uri
          readOnly: true
          type: string
        minutes:
          description: Duration in minutes
          format: int64
          maximum: 1440
          minimum: 1
          type: integer
        note:
          description: Optional note
          maxLength: 1000
          type: string
        studiedAt:
          description: When the study session occurred
          format: date-time
          type: string
        subjectId:
          description: Subject ID
          type: string
      required:
        - subjectId
        - studiedAt
        - minutes
      type: object
    CreateSubjectRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateSubjectRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Subject name
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    CreateUserRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/CreateUserRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: User name
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    GoalResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/GoalResponse.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        endDate:
          description: End date
          type: string
        id:
          description: Goal ID
          type: string
        startDate:
          description: Start date
          type: string
        subjectId:
          description: Subject ID
          type: string
        targetMinutesPerWeek:
          description: Target minutes per week
          format: int64
          type: integer
        updatedAt:
          description: Last update timestamp
          format: date-time
          type: string
        userId:
          description: User ID
          type: string
      required:
        - id
        - userId
        - subjectId
        - targetMinutesPerWeek
        - startDate
        - createdAt
        - updatedAt
      type: object
    StudyLogResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/StudyLogResponse.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        id:
          description: Study log ID
          type: string
        minutes:
          description: Duration in minutes
          format: int64
          type: integer
        note:
          description: Note
          type: string
        studiedAt:
          description: When the study session occurred
          format: date-time
          type: string
        subjectId:
          description: Subject ID
          type: string
        userId:
          description: User ID
          type: string
      required:
        - id
        - userId
        - subjectId
        - studiedAt
        - minutes
        - note
        - createdAt
      type: object
    SubjectResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/SubjectResponse.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        id:
          description: Subject ID
          type: string
        name:
          description: Subject name
          type: string
        updatedAt:
          description: Last update timestamp
          format: date-time
          type: string
        userId:
          description: Owner user ID
          type: string
      required:
        - id
        - userId
        - name
        - createdAt
        - updatedAt
      type: object
    SubjectWeeklyStatsResponse:
      additionalProperties: false
      properties:
        achievementRate:
          description: Achievement rate percentage (0 if no goal)
          format: double
          type: number
        subjectId:
          description: Subject ID
          type: string
        subjectName:
          description: Subject name
          type: string
        targetMinutesPerWeek:
          description: Weekly goal target (0 if no goal)
          format: int64
          type: integer
        totalMinutes:
          description: Total minutes studied this week
          format: int64
          type: integer
      required:
        - subjectId
        - subjectName
        - totalMinutes
        - targetMinutesPerWeek
        - achievementRate
      type: object
    UpdateSubjectRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/UpdateSubjectRequest.json
          format: uri
          readOnly: true
          type: string
        name:
          description: Subject name
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    UpsertGoalRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/UpsertGoalRequest.json
          format: uri
          readOnly: true
          type: string
        endDate:
          description: End date (YYYY-MM-DD), optional
          type: string
        startDate:
          description: Start date (YYYY-MM-DD)
          type: string
        targetMinutesPerWeek:
          description: Target study minutes per week
          format: int64
          minimum: 1
          type: integer
      required:
        - targetMinutesPerWeek
        - startDate
      type: object
    UserResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/UserResponse.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          description: Creation timestamp
          format: date-time
          type: string
        id:
          description: User ID
          type: string
        name:
          description: User name
          type: string
        updatedAt:
          description: Last update timestamp
          format: date-time
          type: string
      required:
        - id
        - name
        - createdAt
        - updatedAt
      type: object
    WeeklyStatsResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - /v1/schemas/WeeklyStatsResponse.json
          format: uri
          readOnly: true
          type: string
        subjects:
          description: Per-subject stats
          items:
            $ref: "#/components/schemas/SubjectWeeklyStatsResponse"
          type:
            - array
            - "null"
        totalMinutes:
          description: Total minutes across all subjects
          format: int64
          type: integer
        weekStart:
          description: Week start date
          type: string
      required:
        - weekStart
        - subjects
        - totalMinutes
      type: object
info:
  description: Learning progress tracking REST API
  title: StudyTrack API
  version: 1.0.0
openapi: 3.1.0
paths:
  /study-logs/{id}:
    delete:
      operationId: delete-study-log
      parameters:
        - description: Study log ID
          in: path
          name: id
          required: true
          schema:
            description: Study log ID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a study log
      tags:
        - StudyLogs
  /subjects/{id}:
    delete:
      operationId: delete-subject
      parameters:
        - description: Subject ID
          in: path
          name: id
          required: true
          schema:
            description: Subject ID
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Delete a subject
      tags:
        - Subjects
    put:
      operationId: update-subject
      parameters:
        - description: Subject ID
          in: path
          name: id
          required: true
          schema:
            description: Subject ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubjectRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Update a subject
      tags:
        - Subjects
  /users:
    post:
      operationId: create-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a new user
      tags:
        - Users
  /users/{id}:
    get:
      operationId: get-user
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          schema:
            description: User ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get a user by ID
      tags:
        - Users
  /users/{userId}/goals:
    get:
      operationId: list-goals
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/GoalResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List goals for a user
      tags:
        - Goals
  /users/{userId}/goals/{subjectId}:
    put:
      operationId: upsert-goal
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
        - description: Subject ID
          in: path
          name: subjectId
          required: true
          schema:
            description: Subject ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGoalRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create or update a goal for a subject
      tags:
        - Goals
  /users/{userId}/stats/weekly:
    get:
      operationId: get-weekly-stats
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
        - description: Week start date (YYYY-MM-DD)
          example: "2024-01-01"
          explode: false
          in: query
          name: weekStart
          required: true
          schema:
            description: Week start date (YYYY-MM-DD)
            examples:
              - "2024-01-01"
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeeklyStatsResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get weekly study statistics
      tags:
        - Stats
  /users/{userId}/study-logs:
    get:
      operationId: list-study-logs
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
        - description: Start date (YYYY-MM-DD)
          example: "2024-01-01"
          explode: false
          in: query
          name: from
          schema:
            description: Start date (YYYY-MM-DD)
            examples:
              - "2024-01-01"
            type: string
        - description: End date (YYYY-MM-DD)
          example: "2024-01-31"
          explode: false
          in: query
          name: to
          schema:
            description: End date (YYYY-MM-DD)
            examples:
              - "2024-01-31"
            type: string
        - description: Filter by subject ID
          explode: false
          in: query
          name: subjectId
          schema:
            description: Filter by subject ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/StudyLogResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List study logs for a user
      tags:
        - StudyLogs
    post:
      operationId: create-study-log
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudyLogRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyLogResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a study log
      tags:
        - StudyLogs
  /users/{userId}/subjects:
    get:
      operationId: list-subjects
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/SubjectResponse"
                type:
                  - array
                  - "null"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List subjects for a user
      tags:
        - Subjects
    post:
      operationId: create-subject
      parameters:
        - description: User ID
          in: path
          name: userId
          required: true
          schema:
            description: User ID
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubjectRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a new subject
      tags:
        - Subjects
servers:
  - url: /v1
